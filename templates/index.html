<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HackaProgress</title>
<style>
  :root {
    --bg:   #bdda9f;   /* your light green: page background */
    --ink:  #141414;   /* your near-black: text, bar track */
    --pop:  #e9145e;   /* your pop pink: the bar fill and the button */
    --soft: #3c4a30;   /* softer dark green for secondary text */
    --field:#eaf3dc;   /* pale tint for the input box */
  }

  body {
    font-family: system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    max-width: 640px;
    margin: 40px auto;
    padding: 0 20px;
    line-height: 1.5;
  }

  h1 { font-size: 2.6rem; margin: 0; letter-spacing: -0.02em; }
  #stage { font-size: 1.2rem; color: var(--soft); margin: 4px 0 24px; }
  #line  { font-size: 1.1rem; font-weight: 600; margin: 0 0 12px; }

  .track {
    height: 28px;
    background: var(--ink);
    border-radius: 14px;
    overflow: hidden;              /* keeps the fill inside the rounded ends */
  }
  .fill {
    height: 100%;
    width: 0;
    background: var(--pop);
    transition: width 1.2s ease;
  }

  .nums { display: flex; justify-content: space-between; margin: 10px 0 28px; font-weight: 600; }

  form { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  input {
    width: 90px; padding: 10px 12px;
    font: inherit; color: var(--ink);
    background: var(--field);
    border: 2px solid var(--ink); border-radius: 10px;
  }
  button {
    padding: 10px 18px; border: 0; border-radius: 10px;
    font: inherit; font-weight: 600; color: #fff;
    background: var(--pop); cursor: pointer;
  }
  button:hover { background: var(--ink); }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  #err { color: #8a0e38; font-weight: 600; min-height: 1.5em; margin-top: 16px; }

  #plant { display: block; margin: 32px auto 0; width: 280px;}
  #stem { transition: stroke-dashoffset 1.2s ease; }
  #seed, .leaf, #flower { transition: transform 1s ease, opacity 1s ease; transform-box: fill-box; }
  .leaf   { transform-origin: 0 100%; transform: scale(0); opacity: 0; }
  #flower { transform-origin: center; transform: scale(0); opacity: 0; }

    @media (prefers-reduced-motion: reduce) { .fill, #stem, #seed, .leaf, #flower { transition: none; } }</style>
</head>
<body>
  <h1>HackaProgress</h1>
  <p id="stage">Seed in the soil</p>
  <p id="line">Loading…</p>

  <div class="track"><div class="fill" id="fill"></div></div>
  <div class="nums"><span id="pct">0%</span><span id="left"></span></div>

  <form id="form">
    <label for="hours">Goal (hours)</label>
    <input id="hours" type="number" min="0.25" step="0.25" value="3">
    <button>Plant new seed</button>
  </form>
  <p id="err"></p>

<svg id="plant" viewBox="0 0 300 340" role="img" aria-label="Plant that grows as you code">
  <!-- soil -->
  <ellipse cx="150" cy="300" rx="130" ry="30" fill="#141414"/>
  <ellipse cx="150" cy="292" rx="110" ry="20" fill="#2b2b2b"/>
  <ellipse id="seed" cx="150" cy="284" rx="9" ry="6" fill="#c9a227"/>

  <!-- stem -->
  <path id="stem" pathLength="1" d="M150 288 C 140 225, 160 165, 150 100"
        fill="none" stroke="#2f5d2a" stroke-width="7" stroke-linecap="round"
        stroke-dasharray="1" stroke-dashoffset="1"/>

  <!-- leaves -->
  <g transform="translate(146 246)"><path class="leaf" data-at=".12" fill="#4f8a3d" d="M0 0C20-24 52-24 64-4C48 8 20 10 0 0Z"/></g>
  <g transform="translate(150 215) scale(-1 1)"><path class="leaf" data-at=".28" fill="#6fa650" d="M0 0C20-24 52-24 64-4C48 8 20 10 0 0Z"/></g>
  <g transform="translate(153 180)"><path class="leaf" data-at=".43" fill="#4f8a3d" d="M0 0C20-24 52-24 64-4C48 8 20 10 0 0Z"/></g>
  <g transform="translate(152 145) scale(-1 1)"><path class="leaf" data-at=".56" fill="#6fa650" d="M0 0C20-24 52-24 64-4C48 8 20 10 0 0Z"/></g>

  <!-- flower -->
  <g transform="translate(150 100)">
    <g id="flower">
      <g fill="#e9145e">
        <ellipse cy="-24" rx="12" ry="24"/>
        <ellipse cy="-24" rx="12" ry="24" transform="rotate(45)"/>
        <ellipse cy="-24" rx="12" ry="24" transform="rotate(90)"/>
        <ellipse cy="-24" rx="12" ry="24" transform="rotate(135)"/>
        <ellipse cy="-24" rx="12" ry="24" transform="rotate(180)"/>
        <ellipse cy="-24" rx="12" ry="24" transform="rotate(225)"/>
        <ellipse cy="-24" rx="12" ry="24" transform="rotate(270)"/>
        <ellipse cy="-24" rx="12" ry="24" transform="rotate(315)"/>
      </g>
      <circle r="14" fill="#f2c230"/>
    </g>
  </g>
</svg>

<script>
const $ = id => document.getElementById(id);

function fmt(seconds) {
  const m = Math.floor(seconds / 60);
  return m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m}m`;
}

function stageName(p) {
  if (p >= 1)    return "In bloom";
  if (p >= 0.75) return "Budding";
  if (p >= 0.5)  return "Growing";
  if (p >= 0.25) return "Seedling";
  if (p >= 0.05) return "Sprout";
  return "Seed in the soil";
}

const clamp = (x, lo = 0, hi = 1) => Math.min(hi, Math.max(lo, x));

function grow(p) {
  $("stem").style.strokeDashoffset = 1 - clamp(p / 0.7);

  document.querySelectorAll(".leaf").forEach(leaf => {
    const s = clamp((p - leaf.dataset.at) / 0.12);
    leaf.style.transform = `scale(${s})`;
    leaf.style.opacity = s;
  });

  $("flower").style.opacity = clamp((p - 0.62) / 0.08);
  $("flower").style.transform = `scale(${0.2 + 0.8 * clamp((p - 0.7) / 0.3)})`;

  $("seed").style.opacity = p < 0.05 ? 1 : 0;
}

async function refresh() {
  try {
    const res = await fetch("/api/progress");
    const d = await res.json();
    if (!res.ok) throw new Error(d.error);
    $("err").textContent = "";
    $("stage").textContent = stageName(d.percent);
    $("line").textContent = `${fmt(d.done)} coded of ${fmt(d.goal)}`;
    $("fill").style.width = `${d.percent * 100}%`;
        grow(d.percent);
    $("pct").textContent = `${Math.floor(d.percent * 100)}%`;
    $("left").textContent = d.percent >= 1 ? "Goal reached" : `${fmt(d.goal - d.done)} to go`;
  } catch (e) {
    $("err").textContent = e.message;
  }
}

$("form").addEventListener("submit", async e => {
  e.preventDefault();                       // stop the page reloading
  const res = await fetch("/api/goal", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ hours: $("hours").value }),
  });
  if (!res.ok) { $("err").textContent = (await res.json()).error; return; }
  refresh();
});

refresh();
setInterval(refresh, 15000);             
</script>
</body>
</html>
